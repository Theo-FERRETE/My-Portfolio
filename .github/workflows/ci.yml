name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Le build n'a pas besoin de vraies credentials Supabase (les échecs sont
      # gérés proprement à l'exécution) — ces valeurs ne servent qu'à satisfaire
      # les vérifications de présence des variables d'environnement.
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXTAUTH_SECRET: placeholder-secret-for-ci-build-only
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD_HASH: placeholder-hash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
